[project]
name = "vascular"
version = "0.1.0"
description = "Vascular identification project"
authors = [
    { name = "Julia Słowińska" },
    { name = "Paweł Pilarek" },
    { name = "Marcel Musiałek" },
]
requires-python = ">=3.10,<3.12"
license = "MIT"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3.0,<3",
    "pillow>=11.3.0,<12",
    "lightning>=2.5.2,<3",
    "timm>=1.0.19",
    "pandas>=2.3.1",
    "torchmetrics>=1.8.0",
    "rich>=14.1.0",
    "scikit-learn>=1.7.1",
    "pyarrow>=21.0.0",
    "tensorboard>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "isort",
    "pytest",
]
