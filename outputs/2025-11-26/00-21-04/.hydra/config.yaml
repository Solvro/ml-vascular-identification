name: mmcbnu
transforms:
  img_size: 224
  train: true
  hflip_p: 0.3
  normalize: imagenet
split:
  train: 0.6
  val: 0.2
  test: 0.2
  seed: 42
loader:
  batch_size: 64
  num_workers: 0
  pin_memory: true
  sampler:
    P: 16
    K: 4
trainer:
  embedding_dim: 512
  epochs: 100
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001
model:
  name: resnet50_cbam
  type: resnet_cbam
  architecture: resnet50_cbam
  embedding_dim: 384
  input_channels: 3
  dropout: 0.5
  depth: 50
  use_cbam: true
  loss:
    name: triplet_center
    margin: 0.3
    mining: hard
    lambda_triplet: 1.0
    lambda_center: 0.0005
  optimizer:
    name: adam
    lr: 3.0e-05
    weight_decay: 0.001
mode: openset
known_ratio: 0.7
val_ratio: 0.15
seed: 42
optimize_threshold: true
threshold_metric: oscr
openset_threshold: 0.5
k_neighbors: 1
