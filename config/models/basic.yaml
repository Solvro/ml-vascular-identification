# Basic CNN Model Configuration
# @package model

name: simple_cnn
type: basic
architecture: basic_cnn

# Model parameters
embedding_dim: 256
input_channels: 3

# Loss configuration
loss:
  name: triplet
  margin: 0.3

# Optimizer configuration
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
