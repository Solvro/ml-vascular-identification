# U-Net Model Configuration
# @package model

name: unet_embedding
type: unet
architecture: unet_basic

# Model parameters
embedding_dim: 256
input_channels: 3
encoder_depth: 5

# Loss configuration
loss:
  name: triplet
  margin: 0.3

# Optimizer configuration
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
